<body>
<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9c6d2, 700, 7000);   // 上午海面薄雾(偏蓝)
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 20000);
camera.position.set(0, 2.3, 0);                    // 站在船上拍照的视线高度

// ---------- 程序化水面法线 ----------
function makeWaterNormals(size = 512) {
  const waves = [];
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 24; i++) {
    const a = rnd() * Math.PI * 2;
    const freq = (2 + rnd() * 30) * Math.PI * 2 / size;
    waves.push({ dx: Math.cos(a), dy: Math.sin(a), freq, amp: 1 / (1 + i * 0.4), ph: rnd() * Math.PI * 2 });
  }
  const h = (x, y) => { let v = 0; for (const w of waves) v += Math.sin((x*w.dx + y*w.dy)*w.freq + w.ph)*w.amp; return v; };
  const img = new ImageData(size, size);
  const S = 0.65;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dhx = h((x+1)%size, y) - h((x-1+size)%size, y);
    const dhy = h(x, (y+1)%size) - h(x, (y-1+size)%size);
    const n = new THREE.Vector3(-dhx*S, -dhy*S, 1).normalize();
    const o = (y*size + x) * 4;
    img.data[o] = (n.x*0.5+0.5)*255; img.data[o+1] = (n.y*0.5+0.5)*255;
    img.data[o+2] = (n.z*0.5+0.5)*255; img.data[o+3] = 255;
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  cv.getContext('2d').putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// ---------- 日出天空 ----------
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const su = sky.material.uniforms;
su.turbidity.value = 7.0;
su.rayleigh.value = 1.1;
su.mieCoefficient.value = 0.004;
su.mieDirectionalG.value = 0.8;
const elevation = 38, azimuth = 245;   // 上午,太阳在右后方(照片光源方向)
const phi = THREE.MathUtils.degToRad(90 - elevation);
const theta = THREE.MathUtils.degToRad(azimuth);
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
su.sunPosition.value.copy(sunDir);

// ---------- 海面 ----------
const water = new Water(new THREE.PlaneGeometry(12000, 12000), {
  textureWidth: 512, textureHeight: 512,
  waterNormals: makeWaterNormals(),
  sunDirection: sunDir.clone(),
  sunColor: 0xf7f3e8,
  waterColor: 0x0a2d4d,
  distortionScale: 1.0,
  fog: true,
});
water.rotation.x = -Math.PI / 2;
water.material.uniforms.time.value = 7.3;
water.material.uniforms.size.value = 7.0;
scene.add(water);

// ---------- 光 ----------
const sunLight = new THREE.DirectionalLight(0xfff2dd, 2.6);
sunLight.position.copy(sunDir).multiplyScalar(120);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x8fa5bd, 0.9));
const bounce = new THREE.HemisphereLight(0xbdd2ea, 0x1a3a55, 0.85); // 蓝天光 + 海面反光
scene.add(bounce);

// ---------- 程序化海豚(飞旋海豚,身体沿圆弧弯曲) ----------
function dolphinBody(L = 1.9, R = 1.6) {
  // 半径轮廓:吻突细长 -> 额隆 -> 躯干最粗 -> 尾柄收细
  const prof = t => {
    if (t < 0.07) return 0.016 + t/0.07*0.032;
    if (t < 0.17) return 0.048 + (t-0.07)/0.10*0.055;
    if (t < 0.48) return 0.103 + Math.sin((t-0.17)/0.31*Math.PI/2)*0.052;
    return Math.max(0.014, 0.155*Math.pow(1-(t-0.48)/0.52, 0.92));
  };
  const N = 48, M = 14;
  const pos = [], idx = [];
  const spine = t => {                    // 沿圆弧的脊柱(s=0 在吻端)
    const s = t*L, a = s/R;
    return { x: R*Math.sin(a), y: R*Math.cos(a)-R, tan: -a };
  };
  for (let i = 0; i <= N; i++) {
    const t = i/N, r = prof(t), sp = spine(t);
    const ca = Math.cos(sp.tan), sa = Math.sin(sp.tan);
    for (let j = 0; j <= M; j++) {
      const th = j/M*Math.PI*2;
      const ry = r*1.06*Math.cos(th), rz = r*0.88*Math.sin(th);
      // 法向(垂直于切线,在 XY 面内)= (-sa? ) 切线角为 sp.tan
      pos.push(sp.x - Math.sin(sp.tan)*ry, sp.y + Math.cos(sp.tan)*ry, rz);
    }
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
    const a = i*(M+1)+j, b = a+M+1;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return { geo: g, spine, prof, L, R };
}
function finShape(len, ht, sweep) {       // 后掠鳍形
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(sweep*0.15, ht*0.9, sweep, ht);
  s.quadraticCurveTo(sweep*0.75, ht*0.35, len, 0);
  s.closePath();
  return s;
}
function makeDolphin({ arc = 0.55 } = {}) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x39424d, roughness: 0.28, metalness: 0.05 });
  const g = new THREE.Group();
  const { geo, spine, prof, L, R } = dolphinBody();
  g.add(new THREE.Mesh(geo, mat));
  const place = (mesh, t, outward) => {   // 把鳍放到脊柱 t 处
    const sp = spine(t);
    mesh.position.set(sp.x - Math.sin(sp.tan)*outward, sp.y + Math.cos(sp.tan)*outward, 0);
    mesh.rotation.z = sp.tan;
  };
  // 背鳍
  const dorsal = new THREE.Mesh(new THREE.ExtrudeGeometry(finShape(0.30, 0.22, -0.16), { depth: 0.022, bevelEnabled: false }), mat);
  dorsal.geometry.translate(-0.13, 0, -0.011);
  place(dorsal, 0.44, prof(0.44)*0.92);
  g.add(dorsal);
  // 尾鳍(水平)
  const fl = new THREE.Mesh(new THREE.ExtrudeGeometry(finShape(0.24, 0.30, -0.13), { depth: 0.016, bevelEnabled: false }), mat);
  fl.geometry.translate(-0.05, 0, -0.008);
  const fr = fl.clone();
  fl.rotation.x = Math.PI/2;  fr.rotation.x = -Math.PI/2;
  const tail = spine(0.995);
  for (const f of [fl, fr]) {
    f.position.set(tail.x - Math.sin(tail.tan)*0.0, tail.y, 0);
    f.rotation.z = tail.tan - 0.35;
    g.add(f);
  }
  // 胸鳍一对
  for (const sgn of [1, -1]) {
    const p = new THREE.Mesh(new THREE.ExtrudeGeometry(finShape(0.20, 0.16, -0.10), { depth: 0.015, bevelEnabled: false }), mat);
    p.geometry.translate(-0.04, 0, -0.0075);
    const sp = spine(0.27);
    p.position.set(sp.x - Math.sin(sp.tan)*(-prof(0.27)*0.35), sp.y + Math.cos(sp.tan)*(-prof(0.27)*0.35), sgn*prof(0.27)*0.7);
    p.rotation.z = sp.tan + Math.PI + 0.5;       // 指向斜后下
    p.rotation.x = sgn*0.9;
    g.add(p);
  }
  // 让弧线对称(∩ 形):整体绕 Z 转半个弧角
  const total = L/R;
  const wrap = new THREE.Group();
  g.rotation.z = total/2;
  wrap.add(g);
  return wrap;
}

// ---------- 水花 ----------
function splashTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(64,64,4, 64,64,60);
  grd.addColorStop(0, 'rgba(255,250,240,0.95)');
  grd.addColorStop(0.35, 'rgba(255,240,220,0.5)');
  grd.addColorStop(1, 'rgba(255,240,220,0)');
  x.fillStyle = grd; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const splashTex = splashTexture();
function addSplash(x, z, s = 1, o = 0.55) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: splashTex, transparent: true, opacity: o,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  sp.position.set(x, 0.25*s, z);
  sp.scale.set(2.2*s, 1.1*s, 1);
  scene.add(sp);
}

// ---------- 海豚群摆位 ----------
function poseDolphin(x, z, { y = 0, yaw = 0, pitch = 0, scale = 1 } = {}) {
  const d = makeDolphin();
  d.position.set(x, y, z);
  d.rotation.y = yaw;
  d.rotation.x = pitch;
  d.scale.setScalar(scale);
  scene.add(d);
  return d;
}
// 照片构图:两只并排出水(背弓+背鳍),紧贴船舷
poseDolphin(1.5, -15, { y: -0.30, yaw: 0.25, scale: 1.2 });  addSplash(1.5, -14.6, 0.7, 0.3);
poseDolphin(4.5, -15.8, { y: -0.26, yaw: 0.2, scale: 1.25 }); addSplash(4.5, -15.4, 0.8, 0.35);
// 左边稍远一只
poseDolphin(-8, -17, { y: -0.42, yaw: 0.15, scale: 1.1 });   addSplash(-8, -16.6, 0.5, 0.25);
// 远处一排背鳍(海豚群路过)
poseDolphin(-18, -42, { y: -0.62, yaw: 0.1 });
poseDolphin(-14, -44, { y: -0.66, yaw: 0.1 });
poseDolphin(-10, -43, { y: -0.64, yaw: 0.15 });
poseDolphin(-5,  -45, { y: -0.68, yaw: 0.1 });

// ---------- Lovina 观豚船(白身蓝边、顶棚、国旗、弯臂+鱼雷浮筒) ----------
function makeJukung({ silhouette = false } = {}) {
  const g = new THREE.Group();
  const white = new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.55 });
  const blue  = new THREE.MeshStandardMaterial({ color: 0x7ec4dd, roughness: 0.6 });
  const red   = new THREE.MeshStandardMaterial({ color: 0xb03028, roughness: 0.6 });
  const darkm = new THREE.MeshStandardMaterial({ color: 0x23282e, roughness: 0.9 });
  // 船体(白,细长,低干舷)
  const hull = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 5.2, 4, 12), white);
  hull.rotation.z = Math.PI/2;
  g.add(hull);
  // 红色腰线(两条细长贴条)
  for (const sz of [-1, 1]) {
    const band = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.09, 0.02), red);
    band.position.set(0, 0.22, sz*0.41);
    g.add(band);
  }
  // 高翘白色船艏 + 印尼国旗
  const prowPts = [new THREE.Vector3(2.7, 0.3, 0), new THREE.Vector3(3.5, 0.9, 0),
                   new THREE.Vector3(3.95, 1.7, 0), new THREE.Vector3(4.0, 2.3, 0)];
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(prowPts), 12, 0.11, 8), white));
  const flagR = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.18), new THREE.MeshBasicMaterial({ color: 0xcc2222, side: THREE.DoubleSide }));
  const flagW = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.18), new THREE.MeshBasicMaterial({ color: 0xf5f5f0, side: THREE.DoubleSide }));
  flagR.position.set(4.28, 2.62, 0); flagW.position.set(4.28, 2.44, 0);
  g.add(flagR, flagW);
  // 船头圆形 logo(橙色贴纸)
  const logo = new THREE.Mesh(new THREE.CircleGeometry(0.2, 20), new THREE.MeshBasicMaterial({ color: 0xe8912a }));
  logo.position.set(1.9, 0.12, 0.43); logo.rotation.y = 0.3;
  g.add(logo);
  // 顶棚:四根白柱 + 深色平顶
  for (const [px, pz] of [[-1.6, 0.32], [-1.6, -0.32], [0.6, 0.32], [0.6, -0.32]]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.75), white);
    post.position.set(px, 1.15, pz);
    g.add(post);
  }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.06, 1.15), darkm);
  roof.position.set(-0.5, 2.05, 0);
  g.add(roof);
  // 弯曲支架 + 鱼雷浮筒(每侧2臂)
  for (const side of [-1, 1]) {
    const float_ = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 3.2, 4, 8), blue);
    float_.rotation.z = Math.PI/2;
    float_.position.set(0.3, 0.02, side*2.35);
    g.add(float_);
    for (const bx of [-1.1, 1.6]) {
      const armPts = [new THREE.Vector3(bx, 0.55, side*0.45), new THREE.Vector3(bx+0.15, 0.62, side*1.3),
                      new THREE.Vector3(bx+0.25, 0.28, side*2.0), new THREE.Vector3(bx+0.3, 0.10, side*2.35)];
      g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(armPts), 10, 0.055, 6), white));
    }
  }
  // 站着扶顶棚的游客 + 船尾船夫
  const tourist = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.75, 4, 8), darkm);
  tourist.position.set(0.15, 1.25, 0); g.add(tourist);
  const tHead = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), new THREE.MeshStandardMaterial({ color: 0x6b4a35, roughness: 0.9 }));
  tHead.position.set(0.15, 1.85, 0); g.add(tHead);
  const boatman = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.45, 4, 8), darkm);
  boatman.position.set(-2.1, 0.85, 0); g.add(boatman);
  const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), tHead.material);
  bHead.position.set(-2.1, 1.32, 0); g.add(bHead);
  return g;
}
// 围观船队(部分逆光成剪影,部分侧光带色)
const boats = [
  { x: -38, z: -55, ry: 0.5, sil: false },
];
for (const b of boats) {
  const bt = makeJukung({ silhouette: b.sil });
  bt.position.set(b.x, 0.1, b.z);
  bt.rotation.y = b.ry;
  scene.add(bt);
}

// ---------- 右侧主船(即照片里那条,船艏朝左对着海豚) ----------
const heroBoat = makeJukung();
heroBoat.position.set(13.5, 0.1, -17);
heroBoat.rotation.y = Math.PI + 0.3;   // 船艏(+X)转向 -X,略偏
scene.add(heroBoat);

// ---------- 远处的巴厘岛山影 ----------
// 左侧层叠海岸山脉(近深远浅的蓝灰)
function ridge(x, z, w, h, color) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 26), new THREE.MeshBasicMaterial({ color, fog: true }));
  m.scale.set(w, h, w*0.4);
  m.position.set(x, h/2 - 8, z);
  scene.add(m);
}
ridge(-3400, -5000, 2800, 380, 0x8494a8);
ridge(-5200, -5400, 3400, 500, 0x8d9cb0);
ridge(-2200, -5800, 2400, 260, 0x97a5b8);
ridge(-7000, -6000, 4000, 420, 0x9aa8ba);

// 程序化积云(柔和白团贴片)
function cloudTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 30; i++) {
    const cx = 50 + rnd()*156, cy = 78 - Math.abs(rnd()*2-1)*38, r = 16 + rnd()*30;
    const grd = x.createRadialGradient(cx, cy, 2, cx, cy, r);
    const bright = 235 + rnd()*20;
    grd.addColorStop(0, `rgba(${bright},${bright},${bright+4},0.42)`);
    grd.addColorStop(0.55, `rgba(${bright-8},${bright-8},${bright},0.2)`);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = grd;
    x.fillRect(0, 0, 256, 128);
  }
  return new THREE.CanvasTexture(c);
}
const cloudTex = cloudTexture();
function addCloud(x, y, z, w, o = 0.9) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w*0.42),
    (() => { const m2 = new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true, opacity: o, depthWrite: false, fog: false }); m2.toneMapped = false; return m2; })());
  m.position.set(x, y, z);
  m.lookAt(camera.position);
  scene.add(m);
}
addCloud(-2400, 1500, -5800, 3400, 1.0);   // 山上方大积云(照片中的主云)
addCloud(-700, 1750, -6400, 3800, 0.9);
addCloud(2400, 1300, -6200, 2600, 0.65);
addCloud(-4800, 1400, -5600, 2800, 0.85);

camera.lookAt(0, 0.8, -60);

renderer.render(scene, camera);
window.__ready = true;
</script>
